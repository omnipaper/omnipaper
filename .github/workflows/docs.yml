# Builds the docs image and pushes it to GHCR as ghcr.io/omnipaper/docs:<run number>.
# Deploying is a separate, deliberate step: bump the image tag in the infra repo.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Native arm64 runner (free for public repos): the cluster is arm64 and
    # skipping QEMU makes the build several times faster.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/docs
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/omnipaper/docs:${{ github.run_number }}
            ghcr.io/omnipaper/docs:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: echo "image ghcr.io/omnipaper/docs:${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
